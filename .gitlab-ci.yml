image: eclipse-temurin:25-jdk

stages:
  - build

build:
  stage: build
  before_script:
    - chmod +x gradlew
  script:
    - ./gradlew build-cs108
  artifacts:
    when: always
    reports:
      junit: build/test-results/test/*.xml
    paths:
      - build/libs/phantom-hunt.jar
      - build/reports/tests/test/
      - build/reports/jacoco/test/html/
    expire_in: 2 weeks
